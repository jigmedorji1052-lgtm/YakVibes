<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost in the Mountains | YakVibes Bhutan</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/bgJgxKq.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Lora:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background-color: #7f1d1d;
        background-image: radial-gradient(rgba(253, 251, 247, 0.1) 1px, transparent 1px);
        background-size: 22px 22px;
        color: #fdfbf7;
        font-family: "Lora", Georgia, serif;
        padding: 2rem;
      }
      .mark {
        font-family: "Noto Serif Tibetan", serif;
        font-size: 2.5rem;
        color: #d97706;
        display: block;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-family: "Outfit", sans-serif;
        color: #c2410c;
        font-size: clamp(2.25rem, 6vw, 3.5rem);
        line-height: 1.1;
        margin-bottom: 1rem;
      }
      p {
        color: rgba(253, 251, 247, 0.85);
        font-size: 1.125rem;
        line-height: 1.7;
        max-width: 34rem;
        margin: 0 auto 2.5rem;
      }
      a.btn {
        display: inline-block;
        font-family: "Outfit", sans-serif;
        font-weight: 600;
        text-decoration: none;
        background-color: #c2410c;
        color: #ffffff;
        padding: 1rem 2rem;
        border-radius: 8px;
        transition: background-color 0.3s ease, transform 0.3s ease;
      }
      a.btn:hover { background-color: #9a3412; transform: translateY(-2px); }
      a.btn:focus-visible { outline: 2px solid #d97706; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">༄</span>
      <h1>Lost in the Mountains</h1>
      <p>
        Even the best trails disappear in the mist. The path you were following doesn't exist —
        but the music is still playing back at the village.
      </p>
      <a class="btn" href="/">Back to the Homepage</a>
    </main>
  </body>
</html>
